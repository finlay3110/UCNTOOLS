name: User guide tests

# The guide must cover every tool the homepage links to, so adding a tool
# without a guide section (or its screenshot) fails here; so does a tool saving
# data that Back up & Restore leaves out. A tool's own change can do that, so
# this runs on every change: it takes seconds.
on:
  push:
  pull_request:

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the guide covers every tool
        run: node guide/test.js
