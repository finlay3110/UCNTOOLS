name: Engineering tests

on:
  push:
    branches: [main]
    paths: ['engineering/**', '.github/workflows/engineering-tests.yml']
  pull_request:
    paths: ['engineering/**', '.github/workflows/engineering-tests.yml']

# A superseded run on the same branch is of no interest once a newer commit
# has been pushed.
concurrency:
  group: engineering-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engineering

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engineering/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries the browser needs on a bare
      # runner. Only chromium: the suite has no other browser project.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            engineering/playwright-report/
            engineering/test-results/
          retention-days: 7
