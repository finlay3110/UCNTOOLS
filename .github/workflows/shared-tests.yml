name: Shared code tests

# shared/mission.js is used by Mission Companion, the homepage and the player
# tools; the test also checks its station list still matches Mission Companion's.
on:
  push:
    paths: ['shared/**', 'mission-companion/index.html', '.github/scripts/whats-new*', '.github/workflows/shared-tests.yml']
  pull_request:
    paths: ['shared/**', 'mission-companion/index.html', '.github/scripts/whats-new*', '.github/workflows/shared-tests.yml']

jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the shared mission code
        run: node shared/test.js
      - name: Check the What's new script
        run: node .github/scripts/whats-new.test.js
