name: Navigation tests

on:
  pull_request:
    branches: [main]
    paths: ['navigation/**', '.github/workflows/navigation-tests.yml']
  push:
    branches: [main]
    paths: ['navigation/**', '.github/workflows/navigation-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    # Installing a browser's system libraries has hung for hours on a runner before.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: navigation

    # The tool is used on an iPhone, so WebKit is the engine that actually
    # matters. Chromium stays in the matrix because a few checks depend on
    # Chromium-only APIs (CDP, beforeinstallprompt) and are skipped elsewhere.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    name: test (${{ matrix.browser }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: navigation/package-lock.json

      - run: npm ci

      # --with-deps pulls the system libraries the engine needs on a bare runner.
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm test
        env:
          UCN_BROWSER: ${{ matrix.browser }}
