name: Validate songbook

# Each song is a file in songbook/songs/, added by hand or by the Submit a song
# form, and the deploy builds songs.json from them. This runs the checks and the
# build on every change, so a broken song never gets as far as main.
on:
  push:
    branches: ['**']
    paths: ['songbook/**', '.github/workflows/songbook-validate.yml', '.github/ISSUE_TEMPLATE/submit-a-song.yml']
  pull_request:
    paths: ['songbook/**', '.github/workflows/songbook-validate.yml', '.github/ISSUE_TEMPLATE/submit-a-song.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: songbook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the song files tooling
        run: node tools/test.mjs

      - name: Validate the songs
        run: node tools/validate-songs.mjs

      - name: Build songs.json, as the deploy does
        run: node tools/build-songs.mjs

      - name: Check the app's files are all present
        run: |
          missing=0
          for f in index.html styles.css app.js lyrics.js songs.json sw.js \
                   manifest.webmanifest pdf-export.js \
                   fonts/exo2-latin.woff2 fonts/opendyslexic-latin-400-normal.woff2 \
                   icons/icon-192.png icons/icon-512.png; do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          exit $missing
