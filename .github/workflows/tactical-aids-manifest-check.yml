name: Tactical Aids manifest check

on:
  push:
    paths: ['tactical-aids/**', '.github/workflows/tactical-aids-manifest-check.yml']
  pull_request:
    paths: ['tactical-aids/**', '.github/workflows/tactical-aids-manifest-check.yml']

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check manifest.json matches pdfs/
        run: node tactical-aids/check-manifest.js
