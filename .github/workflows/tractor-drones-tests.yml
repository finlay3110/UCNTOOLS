name: Tractor & Drones tests

on:
  push:
    paths: ['tractor-drones/**', '.github/workflows/tractor-drones-tests.yml']
  pull_request:
    paths: ['tractor-drones/**', '.github/workflows/tractor-drones-tests.yml']

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tractor-drones
    steps:
      - uses: actions/checkout@v4
      - name: Check the figures
        run: node test.js
