name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Tactical Aids lists every PDF in tactical-aids/pdfs/, so rebuild its
      # index on each deploy (this used to be Netlify's build command).
      - name: Build Tactical Aids manifest
        run: node tactical-aids/build-manifest.js

      # Tools whose offline cache only refreshes when their worker's version changes.
      - name: Stamp service worker cache versions
        run: node .github/scripts/stamp-cache-versions.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
