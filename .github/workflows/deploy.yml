name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save the numbers given to new songs
  pull-requests: read   # What's new reads merged pull requests
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # New songs arrive with no id. Number them here, on main and one deploy
      # at a time (the concurrency group above), and save the numbers, so songs
      # merged close together still get different ones. A push made with this
      # workflow's token starts no new run; this one deploys the numbered songs.
      - name: Number new songs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node songbook/tools/number-songs.mjs
            git diff --quiet -- songbook/songs && exit 0
            git commit -qam 'Songbook: number new songs' && git push -q origin HEAD:main && exit 0
          done
          echo '::error::Could not save the new song numbers to main'
          exit 1

      # The app loads one songs.json, built from the song files. A song that
      # fails its checks stops the deploy here, so the last good site stays up.
      - name: Build the songbook's songs.json
        run: node songbook/tools/build-songs.mjs

      # The homepage's "What's new": each "What's new:" line in a merged pull
      # request's description, and each song added by the form. Best effort:
      # the site still deploys without it.
      - name: Write What's new into the homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/whats-new.js || echo "::warning::What's new was not updated"

      # Tactical Aids lists every PDF in tactical-aids/pdfs/, so rebuild its
      # index on each deploy (this used to be Netlify's build command).
      - name: Build Tactical Aids manifest
        run: node tactical-aids/build-manifest.js

      # shared/ucn-lists.json is the one place the operations and ranks are edited.
      - name: Write shared operations and ranks into the tools
        run: node .github/scripts/sync-shared-lists.js

      # Tools whose offline cache only refreshes when their worker's version changes.
      - name: Stamp service worker cache versions
        run: node .github/scripts/stamp-cache-versions.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      # Optional: with a DISCORD_WEBHOOK_URL secret set (Settings → Secrets and
      # variables → Actions), each pull request with "What's new" lines is
      # posted to that Discord channel as it goes live.
      - name: Post What's new to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          msg=$(node .github/scripts/whats-new.js --discord) || exit 0
          [ -n "$msg" ] || exit 0
          curl -fsS -H 'Content-Type: application/json' -d "$msg" "$DISCORD_WEBHOOK_URL" > /dev/null || echo "::warning::Could not post to Discord"
