name: Scan Trainer tests

on:
  push:
    paths: ['scan-trainer/**', 'shared/challenge.js', '.github/workflows/scan-trainer-tests.yml']
  pull_request:
    paths: ['scan-trainer/**', 'shared/challenge.js', '.github/workflows/scan-trainer-tests.yml']

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scan-trainer
    steps:
      - uses: actions/checkout@v4
      - name: Check the figures
        run: node test.js
