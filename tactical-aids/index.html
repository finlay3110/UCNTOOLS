<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1420;
    --navy:#0e1e2f;
    --navy-panel:#132a40;
    --navy-line:#22415c;
    --orange:#e8823c;
    --ink:#e9eef3;
    --ink-dim:#8fa3b8;
    --black:#04070a;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy-deep);
    background-image:
      radial-gradient(ellipse at top left, rgba(34,65,92,0.25), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(232,130,60,0.06), transparent 55%);
    color:var(--ink);
    font-family:'Exo 2', sans-serif;
    min-height:100vh;
  }

  /* ---- header ---- */
  header{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:2px solid var(--navy-line);
    padding:28px 32px 0;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:16px;
    max-width:1200px;
    margin:0 auto;
  }


  .brand-text h1{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:2px;
    margin:0;
    color:var(--ink);
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:11px;
    letter-spacing:3px;
    color:var(--orange);
    text-transform:uppercase;
    font-weight:600;
  }

  .classified-strip{
    margin-left:auto;
    background:var(--black);
    border:1px solid var(--orange);
    color:var(--orange);
    font-family:'Orbitron', sans-serif;
    font-size:10px;
    letter-spacing:3px;
    font-weight:600;
    padding:5px 12px;
    white-space:nowrap;
  }

  /* Phones: the desktop header wrapped to ~340px and stayed pinned over a
     third of the screen, so it shrinks and the tabs scroll in one row. */
  @media (max-width:600px){
    header{ padding:12px 16px 0; }
    .brand-row{ gap:10px; }
    .brand-text h1{ font-size:16px; letter-spacing:1px; }
    .brand-text p{ font-size:9px; letter-spacing:2px; }
    /* Decorative, and it ran off the edge of the screen. */
    .classified-strip{ display:none; }
  }

  /* ---- tabs ---- */
  .tabs{
    max-width:1200px;
    margin:22px auto 0;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    padding-bottom:0;
  }

  .tab{
    font-family:'Exo 2', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--ink-dim);
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-bottom:none;
    border-radius:6px 6px 0 0;
    padding:10px 18px;
    cursor:pointer;
    position:relative;
    top:1px;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{
    color:var(--ink);
    background:var(--navy-deep);
    border-color:var(--navy-line);
    box-shadow:inset 0 3px 0 var(--orange);
  }
  .tab .count{
    color:var(--ink-dim);
    font-size:11px;
    margin-left:6px;
  }
  .tab.active .count{ color:var(--orange); }

  /* ---- search ---- */
  .toolbar{
    max-width:1200px;
    margin:0 auto;
    padding:18px 0 22px;
    border-bottom:1px solid var(--navy-line);
  }
  .search-wrap{
    position:relative;
    max-width:420px;
    margin-left:32px;
  }
  .search-wrap input{
    width:100%;
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    color:var(--ink);
    font-family:'Exo 2', sans-serif;
    font-size:14px;
    padding:11px 14px 11px 38px;
    border-radius:4px;
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--orange); }
  .search-wrap input::placeholder{ color:var(--ink-dim); }
  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--ink-dim);
  }

  /* ---- main ---- */
  main{
    max-width:1200px;
    margin:0 auto;
    padding:28px 32px 80px;
  }

  @media (max-width:600px){
    .tabs{ margin-top:12px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .tabs::-webkit-scrollbar{ display:none; }
    .tab{ flex-shrink:0; padding:9px 14px; }
    .toolbar{ padding:14px 16px 16px; }
    .search-wrap{ margin-left:0; max-width:none; }
    main{ padding:16px 16px 64px; }
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
  }

  .card{
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:6px;
    padding:18px 16px 14px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover{
    border-color:var(--orange);
    transform:translateY(-2px);
  }

  .ribbon{
    position:absolute;
    top:16px;
    right:-34px;
    width:120px;
    text-align:center;
    transform:rotate(45deg);
    background:var(--black);
    color:var(--orange);
    font-family:'Orbitron', sans-serif;
    font-size:8px;
    font-weight:600;
    letter-spacing:2px;
    padding:2px 0;
    border-top:1px solid var(--orange);
    border-bottom:1px solid var(--orange);
  }

  .card .cat-label{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--orange);
    font-weight:600;
  }
  .card h3{
    margin:0;
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    padding-right:28px;
  }
  .card .meta{
    font-size:11px;
    color:var(--ink-dim);
    margin-top:auto;
  }

  .card-actions{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .btn{
    flex:1;
    text-align:center;
    font-family:'Exo 2', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.5px;
    padding:8px 0;
    border-radius:4px;
    text-decoration:none;
    cursor:pointer;
    border:1px solid var(--navy-line);
    color:var(--ink);
    background:transparent;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover{ border-color:var(--orange); }
  .btn.primary{
    background:var(--orange);
    border-color:var(--orange);
    color:var(--black);
  }
  .btn.primary:hover{ background:#f19552; }

  .empty-state{
    grid-column:1 / -1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
  }
  .empty-state strong{
    display:block;
    color:var(--ink);
    font-family:'Orbitron', sans-serif;
    letter-spacing:1px;
    font-size:14px;
    margin-bottom:6px;
  }

  /* ---- viewer modal ---- */
  .viewer-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(4,7,10,0.85);
    z-index:100;
    padding:24px;
  }
  .viewer-overlay.open{ display:flex; flex-direction:column; }
  .viewer-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1000px;
    width:100%;
    margin:0 auto 12px;
  }
  .viewer-bar h4{
    margin:0;
    font-size:14px;
    color:var(--ink);
    font-weight:600;
  }
  .viewer-bar button{
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    color:var(--ink);
    font-family:'Exo 2', sans-serif;
    font-size:13px;
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
  }
  .viewer-bar button:hover{ border-color:var(--orange); }
  .viewer-frame{
    flex:1;
    max-width:1000px;
    width:100%;
    margin:0 auto;
    background:var(--black);
    border:1px solid var(--navy-line);
    border-radius:6px;
    overflow:hidden;
  }
  .viewer-frame iframe{
    width:100%;
    height:100%;
    border:none;
  }

  footer{
    text-align:center;
    padding:20px;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:1px;
  }

  .visually-hidden{
    position:absolute;
    width:1px;
    height:1px;
    margin:-1px;
    padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
  }

  /* ---- agreement asked before some documents ---- */
  .agree{
    max-width:640px; width:calc(100% - 32px); max-height:90vh; padding:0; overflow:auto;
    background:var(--navy-panel); color:var(--ink);
    border:1px solid var(--navy-line); border-radius:8px;
  }
  .agree::backdrop{ background:rgba(4,7,10,0.85); }
  .agree form{ padding:20px; }
  .agree h2{ margin:0 0 6px; font-family:'Orbitron', sans-serif; font-size:15px; letter-spacing:1px; }
  .agree > form > p{ margin:0 0 12px; color:var(--ink-dim); font-size:14px; line-height:1.5; }
  .agree ol{ margin:0; padding-left:22px; }
  .agree li{ margin:0 0 14px; font-size:14px; line-height:1.5; }
  .agree li p{ margin:0 0 6px; }
  .agree a{ color:var(--orange); overflow-wrap:anywhere; }
  .agree label{ display:inline-flex; align-items:center; gap:8px; min-height:32px; cursor:pointer; }
  .agree input{ width:22px; height:22px; accent-color:var(--orange); }
  .agree-actions{ display:flex; gap:10px; margin-top:8px; }
  .agree-actions .btn{ font-size:13px; padding:10px 0; }

  /* Keyboard focus needs to be visible against the dark panels. */
  .tab:focus-visible,
  .btn:focus-visible,
  .viewer-bar button:focus-visible,
  .agree input:focus-visible,
  .search-wrap input:focus-visible{
    outline:2px solid var(--orange);
    outline-offset:2px;
  }
</style>
</head>

<script>
let manifest = { categories: [] };

// The UCN Academy Manual's author asks every reader to agree to these first,
// in their own words (from the manual's sign-up form).
const AGREEMENTS = {
  'pdfs/general-info/UCN-Academy-Manual.pdf': [
    'I acknowledge that Bridge Command are the owners of any proprietary and copyrighted material.',
    'I can confirm I have been to Bridge Command and I have participated in at least one mission, and I will not share this with anyone unless they have also been on at least one mission.',
    'I can confirm that I have watched the existing training videos at <a href="https://bridgecommand.space/training-videos/" target="_blank" rel="noopener">https://bridgecommand.space/training-videos/</a>',
    'I acknowledge that this is <b>100% unofficial</b>, and whilst Bridge Command have approved publication, no member of the Bridge Command team has formally reviewed, verified, corrected, or approved the contents of this manual.',
    'I can confirm I will <b>not pass</b> any information contained in this manual to <b>anyone</b> who does not want to know it.',
    'I won\'t share this Manual <b>directly</b> with anyone, I will instead direct them to this link so they can make same agreements.',
    'I can confirm that I will <b>not criticise</b> people who do not know this information, and will not assume that any nomenclature, SOPs or any other standardisation are in any way official, or indeed standard!',
    'I acknowledge this is based off of the LARP Empty Epsilon code/icons, and will not take anything in this manual as gospel/canon.',
  ],
};
let pending = null;

function agreementKey(path) {
  return Object.keys(AGREEMENTS).find(k => encodePath(k) === path);
}

// Once agreed, this device isn't asked again.
function agreedTo(path) {
  const key = agreementKey(path);
  if (!key) return true;
  try { return localStorage.getItem('ucnAgreed:' + key) === '1'; } catch (e) { return false; }
}

// Runs then() straight away, or once the reader has agreed to the document's terms.
function withAgreement(path, then) {
  if (agreedTo(path)) return then();
  const key = agreementKey(path);
  pending = { key, then };
  document.getElementById('agreeList').innerHTML = AGREEMENTS[key]
    .map(text => `<li><p>${text}</p><label><input type="checkbox" required> Yes</label></li>`).join('');
  document.getElementById('agree').showModal();
}
let activeTab = 'all';

async function loadManifest() {
  try {
    const res = await fetch('manifest.json', { cache: 'no-store' });
    manifest = await res.json();
  } catch (e) {
    manifest = { categories: [] };
  }
  applyUrl();
}

function allFiles() {
  return manifest.categories.flatMap(cat =>
    cat.files.map(f => ({ ...f, categoryId: cat.id, categoryLabel: cat.label }))
  );
}

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

// Category and file names come straight from folder/filenames on disk, so they
// can contain quotes, ampersands and angle brackets. Escape before interpolating.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);
}

// Encode per segment so spaces, '#', '?' and '&' in filenames survive as a URL
// while the '/' separators stay intact.
function encodePath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

function tabMarkup(id, label, count) {
  const selected = activeTab === id;
  return `<button class="tab ${selected ? 'active' : ''}" role="tab" data-tab="${escapeHtml(id)}"` +
    ` aria-selected="${selected}" tabindex="${selected ? '0' : '-1'}">` +
    `${escapeHtml(label)} <span class="count">${count}</span></button>`;
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  let html = tabMarkup('all', 'All', allFiles().length);
  for (const cat of manifest.categories) {
    html += tabMarkup(cat.id, cat.label, cat.files.length);
  }
  tabsEl.innerHTML = html;

  const tabs = [...tabsEl.querySelectorAll('.tab')];
  tabs.forEach((btn, i) => {
    btn.addEventListener('click', () => selectTab(btn.dataset.tab));
    // Arrow-key movement is what makes a role="tablist" behave like one.
    btn.addEventListener('keydown', (e) => {
      const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      const next = tabs[(i + step + tabs.length) % tabs.length];
      selectTab(next.dataset.tab);
      document.querySelector(`.tab[data-tab="${CSS.escape(next.dataset.tab)}"]`).focus();
    });
  });
}

function selectTab(id) {
  activeTab = id;
  renderTabs();
  renderGrid();
  syncUrl();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const rawQuery = document.getElementById('search').value.trim();
  const query = rawQuery.toLowerCase();

  let files = activeTab === 'all'
    ? allFiles()
    : allFiles().filter(f => f.categoryId === activeTab);

  if (query) {
    files = files.filter(f =>
      f.name.toLowerCase().includes(query) ||
      f.categoryLabel.toLowerCase().includes(query)
    );
  }

  if (files.length === 0) {
    // A failed search and a genuinely empty category need different advice —
    // telling a reader who mistyped to go add files to the repo is nonsense.
    grid.innerHTML = query
      ? `<div class="empty-state">
           <strong>NO MATCHING RECORDS</strong>
           Nothing matches “${escapeHtml(rawQuery)}”. Try a shorter search term, or clear it to see everything.
         </div>`
      : `<div class="empty-state">
           <strong>CATEGORY EMPTY</strong>
           No aids filed under this category yet.
         </div>`;
    return;
  }

  grid.innerHTML = files.map(f => {
    const href = encodePath(f.path);
    return `
    <div class="card">
      <div class="ribbon">FIELD USE</div>
      <div class="cat-label">${escapeHtml(f.categoryLabel)}</div>
      <h3>${escapeHtml(f.name)}</h3>
      <div class="meta">${formatSize(f.size)}${AGREEMENTS[f.path] ? ' · agreement required' : ''}</div>
      <div class="card-actions">
        <button class="btn primary" data-path="${href}" data-name="${escapeHtml(f.name)}">View</button>
        <a class="btn" href="${href}" download>Download</a>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.btn.primary').forEach(btn => {
    btn.addEventListener('click', () => withAgreement(btn.dataset.path, () => openViewer(btn.dataset.path, btn.dataset.name)));
  });
  grid.querySelectorAll('a[download]').forEach(a => {
    a.addEventListener('click', (e) => {
      if (agreedTo(a.getAttribute('href'))) return;
      e.preventDefault();
      withAgreement(a.getAttribute('href'), () => a.click());
    });
  });
}

// iOS/iPadOS Safari and most mobile browsers render a PDF in an iframe as a
// blank frame, so those get the PDF in a new tab instead of the modal viewer.
function supportsInlinePdf() {
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return !iOS && !/Android/.test(ua);
}

let lastFocused = null;
let lastFocusedPath = null;

// Closing can re-render the grid, which destroys the button that opened the
// viewer — so remember its path and re-find the replacement if that happens.
function restoreFocus() {
  let target = lastFocused && document.contains(lastFocused) ? lastFocused : null;
  if (!target && lastFocusedPath) {
    target = document.querySelector(`.btn.primary[data-path="${CSS.escape(lastFocusedPath)}"]`);
  }
  if (target) target.focus();
  lastFocused = null;
  lastFocusedPath = null;
}

function openViewer(path, title, fromHistory) {
  if (!supportsInlinePdf()) {
    window.open(path, '_blank', 'noopener');
    return;
  }
  const overlay = document.getElementById('viewerOverlay');
  lastFocused = document.activeElement;
  lastFocusedPath = lastFocused && lastFocused.dataset ? lastFocused.dataset.path || null : null;
  document.getElementById('viewerFrame').src = path;
  document.getElementById('viewerTitle').textContent = title;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  document.getElementById('viewerClose').focus();
  // A history entry means the phone back button closes the viewer rather than
  // navigating away from the archive entirely.
  if (!fromHistory) history.pushState({ doc: path }, '', urlFor(path));
}

function closeViewer(fromHistory) {
  const overlay = document.getElementById('viewerOverlay');
  if (!overlay.classList.contains('open')) return;
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  document.getElementById('viewerFrame').src = '';
  restoreFocus();
  if (!fromHistory) history.pushState({}, '', urlFor(null));
}

// Keep Tab inside the dialog while it is open.
function trapFocus(e) {
  const overlay = document.getElementById('viewerOverlay');
  if (e.key !== 'Tab' || !overlay.classList.contains('open')) return;
  const focusable = overlay.querySelectorAll('button, iframe, [href], [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

/* ---- URL state, so a category or a document can be linked to ---- */

function urlFor(docPath) {
  const params = new URLSearchParams();
  if (activeTab !== 'all') params.set('cat', activeTab);
  const q = document.getElementById('search').value.trim();
  if (q) params.set('q', q);
  if (docPath) params.set('doc', docPath);
  const s = params.toString();
  return s ? '#' + s : location.pathname + location.search;
}

function syncUrl() {
  history.replaceState(history.state || {}, '', urlFor(null));
}

let rendered = false;

function applyUrl() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const cat = params.get('cat') || 'all';
  const nextTab = manifest.categories.some(c => c.id === cat) ? cat : 'all';
  const nextQuery = params.get('q') || '';
  const searchEl = document.getElementById('search');

  // Only re-render when something actually changed; a needless re-render would
  // throw away the card the viewer should hand focus back to.
  if (!rendered || nextTab !== activeTab || nextQuery !== searchEl.value) {
    activeTab = nextTab;
    searchEl.value = nextQuery;
    renderTabs();
    renderGrid();
    rendered = true;
  }

  const doc = params.get('doc');
  if (doc) {
    const match = allFiles().find(f => encodePath(f.path) === doc);
    if (match) {
      // A link can ask for a page, e.g. a section of the Academy Manual from another tool.
      const page = parseInt(params.get('page'), 10);
      const src = page > 0 && page < 10000 ? doc + '#page=' + page : doc;
      withAgreement(doc, () => openViewer(src, match.name, true));
      return;
    }
  }
  closeViewer(true);
}

// Route close through history so the back button, Escape and the close button
// all leave the same trail.
function requestCloseViewer() {
  if (history.state && history.state.doc) history.back();
  else closeViewer(true);
}

document.getElementById('agreeForm').addEventListener('submit', (e) => {
  e.preventDefault();
  document.getElementById('agree').close();
  if (e.submitter && e.submitter.value === 'ok' && pending) {
    try { localStorage.setItem('ucnAgreed:' + pending.key, '1'); } catch (err) { /* asked again next time */ }
    pending.then();
  }
  pending = null;
});

document.getElementById('viewerClose').addEventListener('click', requestCloseViewer);
document.getElementById('viewerOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'viewerOverlay') requestCloseViewer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') requestCloseViewer();
  trapFocus(e);
});
window.addEventListener('popstate', () => applyUrl());

document.getElementById('search').addEventListener('input', () => {
  renderGrid();
  syncUrl();
});

if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

loadManifest();
</script>

<script>
  // ucn-lists:latest (from shared/latest.js, written on deploy: edit that file, not this code)
  /* "Get latest version", on every tool: a link marked data-ucn-latest drops
     this tool's offline copy (its service worker, and the caches holding its
     files) and reloads it from the site. Saved data in localStorage is kept, and
     the other tools' offline copies are left alone. With no signal it stops
     first, so the tool is never left with no copy at all. Plain ES5. */
  function ucnGetLatest(e) {
    e.preventDefault();
    if (!confirm('Get the latest version of this tool?\n\nIt reloads from the site. Your saved logs and settings are kept.')) return;
    var base = new URL('./', location.href).href;
    var noop = function () {};
    // Is the site reachable? No tool keeps its sw.js offline, and a fresh query
    // gets past the browser's cache, so only the site can answer with it.
    var online = new Promise(function (ok, fail) {
      setTimeout(fail, 8000);   // Wi-Fi that is joined but passes nothing just hangs
      fetch(base + 'sw.js?latest=' + Date.now(), { cache: 'no-store' }).then(function (res) {
        if (res.ok && /javascript/.test(res.headers.get('content-type') || '')) ok(); else fail();
      }, fail);
    });
    online.then(function () {
      var regs = 'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().catch(function () { return []; }) : Promise.resolve([]);
      var drop = window.caches ? caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) {
          return caches.open(k).then(function (c) { return c.keys(); }).then(function (reqs) {
            var ours = reqs.some(function (r) { return r.url.indexOf(base) === 0; });
            return ours ? caches.delete(k) : null;
          });
        }));
      }).catch(noop) : null;
      return Promise.all([drop, regs.then(function (all) {
        return Promise.all(all.filter(function (r) { return r.scope === base; }).map(function (r) { return r.unregister().catch(noop); }));
      })]);
    }).then(function () {
      location.reload();
    }, function () {
      alert('Can’t reach the site right now, so this tool’s offline copy is kept. Try again when you have signal.');
    });
  }
  (function () {
    var links = document.querySelectorAll('[data-ucn-latest]');
    for (var i = 0; i < links.length; i++) links[i].addEventListener('click', ucnGetLatest);
  })();
  // ucn-lists:end
</script>
