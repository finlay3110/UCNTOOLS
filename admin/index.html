<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f1c">
<title>Admin Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<!-- A joke: a very official keypad, and the "correct" code is a Rick Roll. Not a tool, so it has no guide entry. -->
<style>
  :root{
    --bg:#0b0f1c; --panel:#141c38; --border:#2a3a66; --text:#e8ecf7; --muted:#8c98bf;
    --orange:#DD7A2B; --cyan:#4FA8C9; --green:#2FB574; --red:#e0524f; --field:#0f1730; --navy:#1B2A5E;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:'Exo 2', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:radial-gradient(ellipse at top, #1b2a5e 0%, var(--bg) 60%) fixed, var(--bg);
  }
  .wrap{ max-width:420px; margin:0 auto; padding:14px 16px 32px; }
  .back{ display:inline-flex; align-items:center; min-height:32px; color:var(--muted); text-decoration:none; font-size:13px; }
  .back:hover{ color:var(--orange); }
  .title-row{ display:flex; align-items:center; gap:10px; }
  h1{ font-family:'Orbitron', sans-serif; font-weight:800; font-size:24px; letter-spacing:2px; margin:6px 0 2px; }
  .sub{ margin:0 0 16px; color:var(--orange); font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:600; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 14px 20px; text-align:center; }
  h2{ font-family:'Orbitron', sans-serif; font-size:14px; letter-spacing:1px; color:var(--orange); margin:0; }
  .dots{ display:flex; gap:16px; justify-content:center; margin:18px 0 10px; }
  .dots span{ width:16px; height:16px; border-radius:50%; border:2px solid var(--muted); }
  .dots span.on{ background:var(--orange); border-color:var(--orange); }
  .status{ min-height:3em; margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.5; }
  .pad{ display:grid; grid-template-columns:repeat(3, 76px); gap:12px; justify-content:center; }
  .pad button{
    height:60px; border-radius:12px; border:1px solid var(--border); background:var(--field); color:var(--text);
    font:700 22px 'Exo 2', sans-serif; cursor:pointer; touch-action:manipulation;
  }
  .pad button.small{ font-size:13px; letter-spacing:1px; text-transform:uppercase; }
  .pad button:active{ background:var(--navy); }
  .pad button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .denied .status{ color:var(--red); font-weight:700; }
  .denied .dots span.on{ background:var(--red); border-color:var(--red); }
  .denied .panel{ border-color:var(--red); animation:shake .4s; }
  .granted .status{ color:var(--green); font-weight:700; }
  .granted .dots span.on{ background:var(--green); border-color:var(--green); }
  .granted .panel{ border-color:var(--green); }
  @keyframes shake{ 20%,60%{ transform:translateX(-8px); } 40%,80%{ transform:translateX(8px); } }
  @media (prefers-reduced-motion: reduce){ .denied .panel{ animation:none; } }
  .note{ margin:16px 0 0; color:var(--muted); font-size:11.5px; text-align:center; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">&larr; Back to Tool Portal</a>
  <div class="title-row">

    <h1>ADMIN ACCESS</h1>
  </div>
  <p class="sub">Fleet Command personnel only</p>

  <section class="panel" aria-labelledby="lockTitle">
    <h2 id="lockTitle">Enter command code</h2>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p class="status" id="status" role="status" aria-live="polite">Restricted terminal. All attempts are logged.</p>
    <div class="pad" role="group" aria-label="Keypad">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" class="small" data-key="clear">Clear</button><button type="button" data-key="0">0</button><button type="button" class="small" data-key="enter">Enter</button>
    </div>
  </section>
  <p class="note">Unauthorised access is a court-martial offence.</p>
</main>

<script>
  // The joke: the "secure" admin code is the one everyone tries first, and it opens a Rick Roll.
  var CODE = '1234';
  var RICK = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
  var DENIED = [
    'ACCESS DENIED. This attempt has been logged.',
    'ACCESS DENIED. Fleet Command has been notified.',
    'ACCESS DENIED. Hint: Fleet Command picked something easy to remember.'
  ];
  var entered = '', tries = 0, busy = false;
  // Not "status": at the top level that is the browser's own window.status, which turns it into text.
  var dots = document.querySelectorAll('.dots span'), statusEl = document.getElementById('status');

  function show() {
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i < entered.length);
  }
  function check() {
    if (entered.length < 4) { statusEl.textContent = 'Enter all four digits.'; return; }
    busy = true;
    if (entered === CODE) {
      document.body.classList.add('granted');
      statusEl.textContent = 'ACCESS GRANTED. Welcome, Admiral. Opening the command console…';
      // replace, so Back returns to the portal rather than to this keypad
      setTimeout(function () { location.replace(RICK); }, 1200);
      return;
    }
    tries++;
    document.body.classList.add('denied');
    statusEl.textContent = DENIED[Math.min(tries, DENIED.length) - 1];
    setTimeout(function () { document.body.classList.remove('denied'); entered = ''; show(); busy = false; }, 900);
  }
  function press(key) {
    if (busy) return;
    if (key === 'clear') entered = '';
    else if (key === 'back') entered = entered.slice(0, -1);
    else if (key === 'enter') return check();
    else if (entered.length < 4) entered += key;
    show();
    if (entered.length === 4) check();
  }
  document.querySelector('.pad').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) press(b.getAttribute('data-key'));
  });
  document.addEventListener('keydown', function (e) {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Escape') press('clear');
    else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))) press('enter');
  });
</script>
</body>
</html>
